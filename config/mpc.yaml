mpc:
  ros__parameters:
    # Frames and transform usage
    use_tf_pose: false
    base_frame: "RR06"
    tracking_frame: "world"

    # Topics
    pose_topic: "/RR06/world"          # geometry_msgs/PoseStamped input
    goal_topic: "/goal_pose"          # geometry_msgs/PoseStamped goal
    cmd_vel_topic: "/RR06/cmd_vel_auto"    # geometry_msgs/Twist output

    # Behavior
    goal_tolerance: 0.3          # stop radius [m]
    control_rate_hz: 30.0

    # MPC horizon and dynamics
    dt: 0.05                     # time step [s]
    N_horizon: 20
    v_min: 0.0
    v_max: 1.0
    w_max: 0.5

    # Cost weights
    Q_pos: 5.0
    Q_yaw: 1.0
    R_v: 0.1
    R_w: 0.05
    dR_v: 0.01
    dR_w: 0.01