/**:
  ros__parameters:
    # Frames — use TF for pose in simulation (Gazebo publishes map → {ns}/base_link)
    use_tf_pose: true
    base_frame: "base_link"           # resolved relative to namespace
    tracking_frame: "map"

    # Topics (relative — namespace is set at launch via -r __ns:=/{agent})
    path_topic: "mpc_waypoints"               # path_msgs/SpeedyPath from mighty
    cmd_vel_topic: "cmd_vel"                   # geometry_msgs/Twist output to Gazebo

    # Behavior
    goal_tolerance: 0.3          # stop radius [m]
    control_rate_hz: 30.0

    # MPC horizon and dynamics
    dt: 0.05                     # time step [s]
    N_horizon: 20
    v_min: 0.0
    v_max: 0.5
    # A differential-drive robot's tightest arc while moving is v_max / w_max.
    # At v_max 0.5 / w_max 0.5 that was 1.00 m, wider than the ~1.37 m corridors
    # in ACL_office allow, so the robot cut corners and clipped walls with its
    # inside wheels. w_max 1.5 gives a 0.33 m radius. Measured over 10-run
    # exploration campaigns: wall contacts 2.00/run -> 0.50/run.
    #
    # NOTE: raising w_max ALONE made things worse (4/8 runs stranded, coverage
    # down to 0.82) — it is only safe together with the exploration
    # state-machine fixes in mighty (return-home gate + thrash guard).
    w_max: 1.5
    max_linear_accel: 0.5    # [m/s^2] trapezoidal ramp-up/down rate

    # Cost weights
    Q_pos: 5.0
    Q_yaw: 1.0
    R_v: 0.1
    R_w: 0.05
    dR_v: 0.1
    dR_w: 0.01
